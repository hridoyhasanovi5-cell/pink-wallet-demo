<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bKash</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}
header{
background:#e2136e;
color:white;
padding:25px 20px;
border-radius:0 0 20px 20px;
}
.logo{
font-size:27px;
font-weight:bold;
}
.balance{
background:white;
color:#333;
margin:20px;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 2px 10px #ddd;
}
.balance h1{color:#e2136e}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
padding:20px;
}
.item{
background:white;
padding:25px 10px;
border-radius:15px;
text-align:center;
font-size:17px;
box-shadow:0 2px 8px #ddd;
cursor:pointer;
}
.icon{font-size:32px}
button{
background:#e2136e;
color:white;
border:0;
padding:12px 25px;
border-radius:8px;
font-size:16px;
}
#login{
text-align:center;
padding:30px 20px;
}
input{
padding:13px;
width:90%;
margin:10px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}
#home{display:none}
.note{
font-size:12px;
color:#777;
}
</style>
</head>
<body>

<div id="login">
<h1 style="color:#e2136e">My Wallet</h1>
<h3>Welcome</h3>
<p>ডেমো অ্যাকাউন্টে প্রবেশ করুন</p>
<input id="phone" placeholder="মোবাইল নম্বর">
<input id="pin" type="password" placeholder="ডেমো PIN">
<br>
<button onclick="login()">Login</button>
<p class="note">এটি পরীক্ষামূলক অ্যাপ। আসল টাকা বা OTP ব্যবহার করবেন না।</p>
</div>

<div id="home">
<header>
<div class="logo">My Wallet</div>
<p>আপনার ডিজিটাল ওয়ালেটে স্বাগতম</p>
</header>

<div class="balance">
<p>আপনার ডেমো ব্যালেন্স</p>
<h1 id="money">৳ 5,000.00</h1>
<button onclick="showBalance()">ব্যালেন্স দেখুন</button>
</div>

<div class="grid">
<div class="item" onclick="action('Add Money')">
<div class="icon">💰</div>
Add Money
</div>

<div class="item" onclick="action('Send Money')">
<div class="icon">💸</div>
Send Money
</div>

<div class="item" onclick="action('Cash Out')">
<div class="icon">🏧</div>
Cash Out
</div>

<div class="item" onclick="action('Mobile Recharge')">
<div class="icon">📱</div>
Mobile Recharge
</div>

<div class="item" onclick="action('Payment')">
<div class="icon">💳</div>
Payment
</div>

<div class="item" onclick="action('Transaction History')">
<div class="icon">📋</div>
History
</div>
</div>

<center>
<button onclick="logout()">Logout</button>
</center>
</div>

<script>
function login(){
let phone=document.getElementById("phone").value;
let pin=document.getElementById("pin").value;

if(phone.length<11 || pin.length<4){
alert("সঠিক ডেমো নম্বর ও PIN দিন");
return;
}

document.getElementById("login").style.display="none";
document.getElementById("home").style.display="block";
}

function showBalance(){
alert("আপনার ডেমো ব্যালেন্স ৳ 5,000");
}

function action(name){
alert(name+" ফিচারটি শিগগিরই তৈরি হবে!");
}

function logout(){
document.getElementById("home").style.display="none";
document.getElementById("login").style.display="block";
}
</script>

</body>
</html>
